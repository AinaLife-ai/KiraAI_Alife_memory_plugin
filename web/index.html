shadow:0 7px 14px #ee6d9b44}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.panel,.stat,.card{background:#ffffffe8;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.stat{padding:17px;transition:all .15s}.stat:hover{transform:translateY(-2px);box-shadow:0 12px 28px #49326822}.stat small{color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}.stat strong{display:block;font-size:25px;margin-top:5px;color:var(--ink)}.panel{padding:20px;margin-top:16px}.panel h2{font-size:16px;margin:0 0 15px;color:var(--ink)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}.input{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;color:var(--ink);font:inherit;min-width:180px;flex:1;transition:border-color .15s}.input:focus{outline:0;border-color:var(--violet);box-shadow:0 0 0 3px #7568e822}.input.sm{min-width:80px;padding:6px 9px;font-size:12px;flex:0}.tag{display:inline-block;border-radius:7px;background:#f7ecff;color:#8067c8;padding:2px 7px;margin-left:5px;font-size:12px;font-weight:600}.hide{display:none}.fields{display:grid;grid-template-columns:1fr 1fr;gap:0}.field-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #f0e9f3;min-height:48px;gap:12px}.field-row:last-child{border-bottom:0}.field-row label{color:var(--ink);font-size:13px;font-weight:600;flex:1;min-width:0}.field-row .hint{color:var(--muted);font-size:11px;font-weight:400;display:block;margin-top:2px}.field-row input,.field-row select{width:auto;min-width:100px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:white;color:var(--ink);font:inherit;font-size:13px;text-align:right;transition:border-color .15s}.field-row input:focus,.field-row select:focus{outline:0;border-color:var(--violet);box-shadow:0 0 0 3px #7568e822}.field-row textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background <script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const apiBase='/api/plugin/alife_memory_z';
const api=(p,o)=>fetch(apiBase+p,{headers:{'Content-Type':'application/json'},...o}).then(r=>r.json());
let cfg={},__models=[];

function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sv(v){return v===undefined||v===null?'—':v}
function openModal(html){$('#modalContent').innerHTML=html;$('#modal').classList.remove('hide')}
function closeModal(){$('#modal').classList.add('hide')}

async function fetchModels(){
  try{const d=await api('/models');__models=d.models||[]}catch(e){__models=[]}
}

document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{
  $$('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  $$('.view').forEach(x=>x.classList.add('hide'));$('#'+b.dataset.tab).classList.remove('hide');
  const f={home:loadHome,memories:loadMemories,tasks:loadTasks,config:loadConfig};
  (f[b.dataset.tab]||(()=>{}))();
});

// ---- 总览 ----
async function loadHome(){
  try{
    const s=await api('/status'),p=await api('/pending');
    const statItems=[['记忆条目',sv(s.memories)],['原始消息',sv(s.messages)],['待压缩',sv(s.pending)],['待压缩轮数',sv(p.round_count)],['待压缩Token',sv(p.token_sum)],['会话数',sv(s.sessions)],['Worker',sv(s.workers)],['启用',s.enabled?'✓':'✗'],['注入',s.auto_inject?'✓':'✗'],['被动召回',s.passive_recall?'✓':'✗']];
    $('#stats').innerHTML=statItems.map(x=>`<div class="stat"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('');
    $('#triggerState').innerHTML=`<div class="row" style="flex-wrap:wrap"><span class="tag">${esc(s.trigger_mode||'either')}</span><span>轮数阈值 ${s.round_threshold}　Token阈值 ${s.token_threshold}　消息数阈值 ${s.message_threshold}</span></div><p class="meta">压缩触发条件：任一达到阈值即触发</p>`;
  }catch(e){$('#stats').innerHTML='<div class="empty">加载失败，请刷新</div>'}
}

// ---- 记忆管理 ----
async function loadMemories(){
  const q=$('#filterSid')?.value||'',list=await api('/memories?limit=100'+(q?'&sid='+encodeURIComponent(q):''));
  if(!Array.isArray(list)){$('#memoryList').innerHTML='<div class="empty">暂无数据</div>';return}
  $('#memoryList').innerHTML=list.length?list.map(x=>`<div class="memory-item"><h3><span>${esc(x.summary)}</span><span class="tag">L${x.level}</span><span class="tag">${esc(x.status)}</span><span class="tag">${(x.confidence*100).toFixed(0)}%</span></h3><div class="content">${esc(x.content)}</div><div class="meta">${esc(x.id)} · 来源 ${esc(x.sid)} · 用户 ${esc(x.user_id||'—')} · ${new Date(x.end_ts*1000).toLocaleString()}</div><div class="actions"><button class="btn sm alt" onclick="editMemory('${x.id}')">修正</button><button class="btn sm danger" onclick="deleteMemory('${x.id}')">删除</button></div></div>`).join(''):'<div class="empty">没有记忆</div>';
}

function editMemory(id){
  api('/memory/'+id).then(x=>{
    openModal(`<h3>修正记忆</h3><div class="field"><label>概述</label><input id="editSummary" value="${esc(x.summary)}"></div><div class="field"><label>内容</label><textarea id="editContent">${esc(x.content)}</textarea></div><div class="field"><label>修正依据</label><input id="editReason" placeholder="为什么修正？"></div><button class="btn" onclick="doEdit('${id}')">确认修正</button>`);
  });
}
async function doEdit(id){
  const s=$('#editSummary').value,c=$('#editContent').value,r=$('#editReason').value;
  if(!s||!c)return toast('概述和内容不能为空');
  await api('/memory/'+id+'/correct',{method:'POST',body:JSON.stringify({summary:s,content:c,reason:r||'WebUI修正'})});
  toast('记忆已修正');closeModal();loadMemories();
}
async function deleteMemory(id){
  if(!confirm('确定删除这条记忆？'))return;
  await api('/memory/'+id,{method:'DELETE'});toast('已删除');loadMemories();
}

// ---- 检索 ----
async function runSearch(){
  const q=$('#searchQuery').value.trim();
  if(!q)return toast('请输入检索内容');
  const r=await api('/search',{method:'POST',body:JSON.stringify({query:q,sid:$('#searchSid').value,scope:$('#searchScope').value,top_k:10})});
  const list=r.results||[];
  $('#searchResults').innerHTML=list.length?list.map(x=>`<div class="memory-item"><h3><span>${esc(x.summary)}</span><span class="tag">${(x.score*100).toFixed(0)}%</span></h3><div class="content">${esc(x.content)}</div><div class="meta">${esc(x.id)} · 来源 ${esc(x.sid)} · 用户 ${esc(x.user_id||'—')}</div></div>`).join(''):'<div class="empty">无结果</div>';
}

// ---- 任务 ----
async function loadTasks(){
  const list=await api('/tasks?limit=80');
  if(!Array.isArray(list)){$('#taskList').innerHTML='<div class="empty">暂无数据</div>';return}
  $('#taskList').innerHTML=list.length?list.map(x=>`<div class="task-item"><div><strong>${esc(x.kind)}</strong><span class="status ${x.status}">${esc(x.status)}</span><div class="meta">${esc(x.message||'')}</div></div><div class="meta">${new Date(x.updated_at*1000).toLocaleString()}</div></div>`).join(''):'<div class="empty">暂无任务</div>';
}

function getVal(path,def){
  const parts=path.split('.');let o=cfg;
  for(const p of parts){if(!o||typeof o!=='object')return def;o=o[p]}
  return o===undefined||o===null?def:o;
}

async function loadConfig(){
  cfg=await api('/config');
  await fetchModels();
  $('#configForm').innerHTML=configFields.map(([path,label,type,def])=>{
    const val=getVal(path,def);
    if(type==='switch')return `<div class="field-row"><label>${label}</label><label class="switch"><input type="checkbox" data-path="${path}" ${val?'checked':''}><span class="slider"></span></label></div>`;
    if(type==='select')return `<div class="field-row"><label>${label}</label><select data-path="${path}">${def.map(o=>`<option value="${o}"${val===o?' selected':''}>${o}</option>`).join('')}</select></div>`;
    if(type==='model_select')return `<div class="field-row"><label>${label}</label><select data-path="${path}"><option value=""${!val?' selected':''}>默认</option>${__models.map(m=>`<option value="${esc(m.id)}"${val===m.id?' selected':''}>${esc(m.name)}</option>`).join('')}</select></div>`;
    if(type==='number')return `<div class="field-row"><label>${label}</label><input type="number" data-path="${path}" value="${esc(String(val))}"></div>`;
    if(type==='textarea')return `<div class="field-row" style="flex-wrap:wrap"><label>${label}</label><textarea data-path="${path}" rows="3">${esc(String(val))}</textarea></div>`;
    return `<div class="field-row"><label>${label}</label><input data-path="${path}" value="${esc(String(val))}"></div>`;
  }).join('');
}

async function saveConfig(){
  const body=JSON.parse(JSON.stringify(cfg));
  document.querySelectorAll('[data-path]').forEach(el=>{
    const parts=el.dataset.path.split('.');
    let o=body;
    for(let i=0;i<parts.length-1;i++){if(!o[parts[i]])o[parts[i]]={};o=o[parts[i]]}
    const key=parts[parts.length-1];
    if(el.type==='checkbox')o[key]=el.checked;
    else if(el.type==='number')o[key]=Number(el.value);
    else o[key]=el.value;
  });
  await api('/config',{method:'POST',body:JSON.stringify(body)});
  toast('配置已保存并生效');
  loadHome();
}

  const r=await api('/cleanup',{method:'POST'});
  toast('清理完毕：删除消息'+r.deleted_messages+'条，旧版本'+r.deleted_stale_memories+'条');
  loadHome();
}
